<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Fast Pro - Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .theme-spv .nav-btn-active { background-color: #4f46e5 !important; color: white !important; }
        .theme-kasir .nav-btn-active { background-color: #2563eb !important; color: white !important; }

        @media (min-width: 1024px) and (orientation: landscape) {
            .pos-grid { height: calc(100vh - 160px); }
            .sticky-cart { height: calc(100vh - 120px); position: sticky; top: 100px; }
        }

        .payment-opt-active { border-color: #2563eb !important; background-color: #eff6ff !important; color: #2563eb !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen transition-colors duration-500">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="bg-blue-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 rotate-3">
                    <i data-lucide="zap" class="text-blue-600 w-8 h-8 fill-blue-600"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">KasirFast Pro</h1>
                <p class="text-slate-500 text-xs mt-2 font-medium uppercase tracking-widest">Login Outlet & SPV</p>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <i data-lucide="key" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="password" id="token-input" placeholder="Masukkan Token" 
                        class="w-full pl-11 pr-4 py-4 border-2 border-slate-100 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-bold tracking-widest uppercase text-center">
                </div>
                <button id="login-btn" onclick="handleLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2">
                    Masuk Dashboard
                </button>
            </div>
            <div id="login-error" class="mt-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl hidden border border-red-100 font-bold text-center"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 no-print shadow-sm">
            <div class="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div id="brand-icon" class="w-10 h-10 rounded-xl flex items-center justify-center bg-blue-600">
                        <i data-lucide="store" class="text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <span class="font-black text-lg text-slate-900 block leading-none" id="header-outlet-name">KasirFast</span>
                        <span id="role-text" class="text-[9px] uppercase font-bold tracking-widest text-slate-400"></span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <span id="user-display" class="block text-sm font-bold text-slate-800"></span>
                        <span id="status-online" class="text-[9px] text-green-500 font-black flex items-center gap-1 justify-end">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> ONLINE
                        </span>
                    </div>
                    <button onclick="logout()" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 transition-all">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-4 py-6 no-print">
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 custom-scrollbar no-print" id="nav-tabs"></div>
            <div id="content-area"></div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50 no-print p-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl overflow-y-auto max-h-[90vh] animate-fadeIn">
            <div id="receipt-content" class="text-xs font-mono leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100"></div>
            <div class="mt-6 flex flex-col gap-2">
                <button id="copy-text-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition">
                    <i data-lucide="copy" class="w-4 h-4"></i> Salin Struk
                </button>
                <button onclick="window.print()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-black transition">
                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak
                </button>
                <button onclick="closeReceipt()" class="w-full bg-slate-100 text-slate-600 py-3 rounded-2xl font-bold hover:bg-slate-200 transition">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfvaQyjap_G1hAknz5VXMRQ7uzw2XKHrQ",
            authDomain: "mesin-kasir-1fa7e.firebaseapp.com",
            projectId: "mesin-kasir-1fa7e",
            storageBucket: "mesin-kasir-1fa7e.firebasestorage.app",
            messagingSenderId: "120089621210",
            appId: "1:120089621210:web:842fb99067be43d2eeebe3",
            measurementId: "G-1Q98BKHBL8"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = firebaseConfig.projectId;

        let currentUser = null; 
        let currentCart = [];
        let selectedPayment = 'Tunai';

        const OUTLETS = {
            'OUTLET-KARET': 'Outlet Karet',
            'OUTLET-TA1': 'Tanah Abang 1',
            'OUTLET-TA2': 'Tanah Abang 2',
            'OUTLET-DURI1': 'Duri 1',
            'OUTLET-DURI2': 'Duri 2',
            'OUTLET-GROGOL': 'Grogol'
        };

        const MENU = {
            roti: [
                { id: 'r1', name: 'Roti Original', price: 10000 },
                { id: 'r2', name: 'Roti Coklat', price: 11000 },
                { id: 'r3', name: 'Roti Coklat Kacang', price: 12000 },
                { id: 'r4', name: 'Roti Daging', price: 13000 }
            ],
            minuman: [
                { id: 'm1', name: 'Le Minerale', price: 5000 },
                { id: 'm2', name: 'Sari Apel', price: 8000 },
                { id: 'm3', name: 'Madu Salman', price: 5000 }
            ]
        };

        const SAOS_VARIANTS = ['Original', 'Coklat', 'Coklat Kacang', 'Daging'];
        const getPublicCol = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);

        function initIcons() { if (window.lucide) lucide.createIcons(); }

        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            const token = document.getElementById('token-input').value.toUpperCase().trim();
            if (!token) return;

            btn.disabled = true;
            if (OUTLETS[token]) {
                currentUser = { role: 'kasir', name: 'Kasir', outlet: OUTLETS[token], token };
                document.body.className = "bg-slate-50 theme-kasir";
            } else if (token.startsWith('SPV')) {
                currentUser = { role: 'spv', name: 'SPV Operational', outlet: 'All Outlets', token };
                document.body.className = "bg-slate-50 theme-spv";
            } else {
                document.getElementById('login-error').innerText = "Token Tidak Valid";
                document.getElementById('login-error').classList.remove('hidden');
                btn.disabled = false;
                return;
            }

            await auth.signInAnonymously();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser.name;
            document.getElementById('header-outlet-name').innerText = currentUser.outlet;
            document.getElementById('role-text').innerText = currentUser.role === 'spv' ? 'Supervisor Mode' : 'Cashier Mode';
            initNavigation();
        }

        function logout() { location.reload(); }

        function initNavigation() {
            const nav = document.getElementById('nav-tabs');
            let tabs = (currentUser.role === 'kasir') ? [
                { id: 'pos', label: 'Kasir', icon: 'calculator' },
                { id: 'saos', label: 'Input Saos', icon: 'droplet' },
                { id: 'riwayat', label: 'Riwayat', icon: 'history' }
            ] : [
                { id: 'spv_dashboard', label: 'Monitoring', icon: 'bar-chart-3' },
                { id: 'spv_saos', label: 'Data Saos', icon: 'package' },
                { id: 'spv_traffic', label: 'Trafik', icon: 'clock' },
                { id: 'riwayat', label: 'Audit Transaksi', icon: 'shield-check' }
            ];
            nav.innerHTML = tabs.map(t => `<button onclick="switchView('${t.id}')" id="nav-${t.id}" class="flex items-center gap-2 px-6 py-3 rounded-2xl nav-btn bg-white text-slate-500 border border-slate-100 font-bold transition-all shadow-sm hover:shadow-md whitespace-nowrap"><i data-lucide="${t.icon}" class="w-4 h-4"></i> ${t.label}</button>`).join('');
            switchView(tabs[0].id);
        }

        function switchView(viewId) {
            const container = document.getElementById('content-area');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-btn-active'));
            document.getElementById(`nav-${viewId}`)?.classList.add('nav-btn-active');
            
            if(viewId === 'pos') renderPOS(container);
            else if(viewId === 'saos') renderSaos(container);
            else if(viewId === 'riwayat') renderRiwayat(container);
            else if(viewId === 'spv_dashboard') renderSPVDashboard(container);
            else if(viewId === 'spv_saos') renderSPVSaos(container);
            else if(viewId === 'spv_traffic') renderSPVTraffic(container);
            initIcons();
        }

        // --- POS & CART LOGIC ---
        function addToCart(id) {
            const allItems = [...MENU.roti, ...MENU.minuman];
            const item = allItems.find(i => i.id === id);
            const existing = currentCart.find(i => i.id === id);
            if(existing) existing.qty++;
            else currentCart.push({...item, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            if(!list) return;
            list.innerHTML = currentCart.map((it, idx) => `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center animate-fadeIn">
                    <div class="flex-1 overflow-hidden">
                        <div class="font-bold text-slate-800 text-xs truncate">${it.name}</div>
                        <div class="text-[9px] text-slate-500 font-medium">Rp ${it.price.toLocaleString()} x ${it.qty}</div>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white px-1 py-1 rounded-xl border">
                        <button onclick="changeQty(${idx}, -1)" class="w-6 h-6 bg-slate-100 rounded text-slate-600 flex items-center justify-center">-</button>
                        <span class="text-xs font-black min-w-[20px] text-center">${it.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-6 h-6 bg-slate-100 rounded text-slate-600 flex items-center justify-center">+</button>
                    </div>
                </div>`).join('');
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString()}`;
            calcChange();
        }

        function changeQty(idx, delta) {
            currentCart[idx].qty += delta;
            if(currentCart[idx].qty <= 0) currentCart.splice(idx, 1);
            updateCartUI();
        }

        function setPaymentMethod(method) {
            selectedPayment = method;
            document.querySelectorAll('.pay-opt').forEach(btn => {
                btn.classList.toggle('payment-opt-active', btn.dataset.method === method);
            });
            if (method !== 'Tunai') {
                const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
                document.getElementById('cash-input').value = total;
            }
            calcChange();
        }

        function setQuickCash(amount) {
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
            if (amount === 'pas') {
                document.getElementById('cash-input').value = total;
            } else {
                document.getElementById('cash-input').value = amount;
            }
            calcChange();
        }

        function calcChange() {
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
            const cash = parseInt(document.getElementById('cash-input')?.value || 0);
            document.getElementById('change-display').innerText = `Rp ${Math.max(0, cash - total).toLocaleString()}`;
            document.getElementById('pay-btn').disabled = (total === 0 || cash < total);
        }

        async function processCheckout() {
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
            const cash = parseInt(document.getElementById('cash-input').value);
            const data = {
                items: currentCart.map(it => ({...it})),
                total, cash, change: cash - total,
                method: selectedPayment,
                timestamp: firebase.firestore.Timestamp.now(),
                staff: currentUser.name,
                outlet: currentUser.outlet,
                hour: new Date().getHours()
            };
            await getPublicCol('transactions').add(data);
            showReceipt(data);
            currentCart = [];
            document.getElementById('cash-input').value = '';
            selectedPayment = 'Tunai';
            updateCartUI();
        }

        function showReceipt(data) {
            const date = data.timestamp?.toDate ? data.timestamp.toDate() : new Date();
            let text = `   ${data.outlet.toUpperCase()}\n--------------------------\n`;
            text += `Tgl : ${date.toLocaleString()}\nStaf: ${data.staff}\nTipe: ${data.method}\n--------------------------\n`;
            data.items.forEach(it => text += `${it.name.padEnd(18)} x${it.qty}\n             Rp ${(it.price * it.qty).toLocaleString()}\n`);
            text += `--------------------------\nTOTAL    : Rp ${data.total.toLocaleString()}\n`;
            text += `BAYAR    : Rp ${data.cash.toLocaleString()}\n`;
            text += `KEMBALI  : Rp ${data.change.toLocaleString()}\n--------------------------\n`;
            document.getElementById('receipt-content').innerHTML = `<pre class="whitespace-pre-wrap">${text}</pre>`;
            document.getElementById('receipt-modal').classList.replace('hidden', 'flex');
        }

        function closeReceipt() { document.getElementById('receipt-modal').classList.replace('flex', 'hidden'); }

        // --- RENDER VIEWS ---
        function renderPOS(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                    <div class="lg:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-4">
                        ${[...MENU.roti, ...MENU.minuman].map(it => `
                            <button onclick="addToCart('${it.id}')" class="bg-white p-4 rounded-3xl border border-slate-200 text-left hover:border-blue-500 shadow-sm active:scale-95 transition">
                                <div class="text-[9px] text-slate-400 font-bold uppercase">${it.id.startsWith('r')?'Roti':'Minuman'}</div>
                                <div class="text-xs font-bold text-slate-800 mb-2 leading-tight">${it.name}</div>
                                <div class="text-blue-600 font-black text-sm">Rp ${it.price.toLocaleString()}</div>
                            </button>`).join('')}
                    </div>
                    <div class="lg:col-span-1 bg-white rounded-[2rem] border shadow-xl p-6 flex flex-col sticky-cart">
                        <h3 class="font-black text-slate-900 text-sm mb-4">Ringkasan Pesanan</h3>
                        <div id="cart-list" class="flex-1 overflow-y-auto space-y-2 mb-4 custom-scrollbar"></div>
                        <div class="border-t pt-4">
                            <div class="flex justify-between font-black text-lg mb-4"><span>Total</span><span id="total-price" class="text-blue-600">Rp 0</span></div>
                            <div class="grid grid-cols-3 gap-2 mb-4">
                                <button onclick="setPaymentMethod('Tunai')" data-method="Tunai" class="pay-opt payment-opt-active border-2 border-slate-100 py-2 rounded-xl text-[10px] font-black transition">TUNAI</button>
                                <button onclick="setPaymentMethod('QRIS')" data-method="QRIS" class="pay-opt border-2 border-slate-100 py-2 rounded-xl text-[10px] font-black transition">QRIS</button>
                                <button onclick="setPaymentMethod('Debit')" data-method="Debit" class="pay-opt border-2 border-slate-100 py-2 rounded-xl text-[10px] font-black transition">DEBIT</button>
                            </div>
                            <div class="relative mb-2">
                                <input type="number" id="cash-input" oninput="calcChange()" placeholder="Jumlah Bayar" class="w-full p-4 rounded-2xl bg-slate-50 border-none font-black text-lg">
                            </div>
                            <div class="grid grid-cols-4 gap-2 mb-4">
                                <button onclick="setQuickCash('pas')" class="bg-slate-100 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-200">PAS</button>
                                <button onclick="setQuickCash(10000)" class="bg-slate-100 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-200">10k</button>
                                <button onclick="setQuickCash(50000)" class="bg-slate-100 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-200">50k</button>
                                <button onclick="setQuickCash(100000)" class="bg-slate-100 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-200">100k</button>
                            </div>
                            <div class="flex justify-between text-green-600 font-bold text-sm bg-green-50 p-3 rounded-xl mb-4"><span>Kembalian</span><span id="change-display">Rp 0</span></div>
                            <button id="pay-btn" onclick="processCheckout()" disabled class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">PROSES TRANSAKSI</button>
                        </div>
                    </div>
                </div>`;
            updateCartUI();
        }

        function renderSaos(container) {
    container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
            <div class="bg-white p-6 rounded-[2rem] border shadow-lg h-fit">
                <h3 class="text-lg font-black mb-6 text-slate-800">Laporan Stok Saos</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 mb-1 block">Pilih Varian Saos</label>
                        <select id="saos-name" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold">
                            ${SAOS_VARIANTS.map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 mb-1 block">Jumlah (Porsi/Botol)</label>
                        <input type="number" id="saos-qty" value="1" min="1" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black">
                    </div>
                    <button onclick="submitSaos()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black mt-4 active:scale-95 transition">SUBMIT DATA</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border shadow-lg overflow-hidden">
                <h3 class="text-sm font-black mb-4 flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-blue-500"></i> Riwayat Input Hari Ini
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-400 font-black uppercase tracking-tighter">
                            <tr>
                                <th class="px-4 py-3">Jam</th>
                                <th class="px-4 py-3">Varian</th>
                                <th class="px-4 py-3 text-right">Qty</th>
                                <th class="px-4 py-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="local-saos-history" class="divide-y font-bold">
                            <tr><td colspan="4" class="text-center py-10 text-slate-300">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>`;
    initIcons();
    loadLocalSaosHistory();
}

async function loadLocalSaosHistory() {
    const table = document.getElementById('local-saos-history');
    if(!table) return;

    try {
        const today = new Date().toISOString().split('T')[0];
        const snap = await getPublicCol('saos_usage').get();
        
        // SANGAT PENTING: Ambil ID dan Data
        let docs = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        // Filter data
        docs = docs.filter(d => 
            d.outlet === currentUser.outlet && 
            d.timestamp && 
            d.timestamp.toDate().toISOString().split('T')[0] === today
        );

        // Urutkan
        docs.sort((a,b) => b.timestamp.seconds - a.timestamp.seconds);

        // Render HTML
        table.innerHTML = docs.map(d => {
            const jam = d.timestamp.toDate().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            
            return `
                <tr class="hover:bg-slate-50 border-b border-slate-50">
                    <td class="px-4 py-3 text-slate-400 font-medium">${jam}</td>
                    <td class="px-4 py-3 text-slate-800 uppercase font-bold">${d.name}</td>
                    <td class="px-4 py-3 text-right font-black text-blue-600">${d.qty}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteSaos('${d.id}')" 
                                class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center transition-all mx-auto">
                            <span class="text-xs">🗑️</span>
                        </button>
                    </td>
                </tr>`;
        }).join('') || '<tr><td colspan="4" class="text-center py-10 text-slate-300">Belum ada input hari ini</td></tr>';
        
        // Coba jalankan ulang ikon jika library tersedia
        if (typeof initIcons === 'function') initIcons();
        if (typeof lucide !== 'undefined') lucide.createIcons();

    } catch (error) {
        console.error("Detail Error:", error);

async function submitSaos() {
    const qtyInput = document.getElementById('saos-qty');
    const name = document.getElementById('saos-name').value;
    const qty = parseInt(qtyInput.value);

    if(!qty || qty < 1) {
        alert("Masukkan jumlah yang valid");
        return;

    try {
        await getPublicCol('saos_usage').add({ 
            name, 
            qty, 
            staff: currentUser.name, 
            outlet: currentUser.outlet, 
            timestamp: firebase.firestore.Timestamp.now() 
        });
        
        qtyInput.value = 1; // Reset input

async function loadRiwayatData() {

async function loadSPVAnalytics() {
    const dateInput = document.getElementById('spv-date')?.value;
    const outlet = document.getElementById('spv-outlet-filter')?.value || 'ALL';
    if (!dateInput) return;

    const snap = await getPublicCol('transactions').get();
    let data = snap.docs.map(d => d.data());
    
    // Filter Outlet
    if(outlet !== 'ALL') data = data.filter(d => d.outlet === outlet);
    
    let dTot = 0, mTot = 0, yTot = 0;
    const now = new Date(dateInput);
    const selectedYear = now.getFullYear();
    const selectedMonth = now.getMonth();

    data.forEach(t => {
        if (!t.timestamp) return;
        const dt = t.timestamp.toDate();
        const tDate = dt.toISOString().split('T')[0];
        
        // Hitung Total Terpilih (Hari yang dipilih di input date)
        if(tDate === dateInput) dTot += t.total;
        
        // Hitung Total Bulan (Sesuai bulan dari input date)
        if(dt.getMonth() === selectedMonth && dt.getFullYear() === selectedYear) mTot += t.total;
        
        // Hitung Total Tahun (Sesuai tahun dari input date)
        if(dt.getFullYear() === selectedYear) yTot += t.total;
    });

    // Update ke UI
    document.getElementById('total-selected').innerText = `Rp ${dTot.toLocaleString('id-ID')}`;
    document.getElementById('total-month').innerText = `Rp ${mTot.toLocaleString('id-ID')}`;
    document.getElementById('total-year').innerText = `Rp ${yTot.toLocaleString('id-ID')}`;

        async function loadSPVTrafficData() {
            const dateStr = document.getElementById('traffic-date').value;
            const outlet = document.getElementById('spv-outlet-filter').value;
            const snap = await getPublicCol('transactions').get();
            let trans = snap.docs.map(d => d.data());
            
            document.getElementById('display-date-traffic').innerText = `Tgl: ${new Date(dateStr).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}`;
            document.getElementById('display-outlet-traffic').innerText = `Outlet: ${outlet === 'ALL' ? 'Semua Outlet' : outlet}`;
            
            trans = trans.filter(d => d.timestamp.toDate().toISOString().split('T')[0] === dateStr);
            if(outlet !== 'ALL') trans = trans.filter(d => d.outlet === outlet);
            
            const hours = {};
            trans.forEach(t => {
                const h = t.hour || 0;
                if(!hours[h]) hours[h] = { total: 0, items: {} };
                hours[h].total += t.total;
                t.items?.forEach(it => { hours[h].items[it.name] = (hours[h].items[it.name] || 0) + it.qty; });
            });
            
            let grandTotal = 0;
            const tableBody = document.getElementById('spv-traffic-table');
            const sortedHours = Object.entries(hours).sort((a,b) => a[0] - b[0]);
            
            tableBody.innerHTML = sortedHours.map(([h, st]) => {
                grandTotal += st.total;
                const itemDetails = Object.entries(st.items).map(([name, qty]) => `<span class="inline-block bg-slate-100 px-2 py-1 rounded-lg text-[9px] mr-1 mb-1">${name} (${qty})</span>`).join('');
                return `
                    <tr class="hover:bg-slate-50/50">
                        <td class="px-6 py-5 font-black text-indigo-600">${h.toString().padStart(2, '0')}:00</td>
                        <td class="px-6 py-5">${itemDetails}</td>
                        <td class="px-6 py-5 text-right text-sm font-black">Rp ${st.total.toLocaleString()}</td>
                    </tr>`;
            }).join('') || '<tr><td colspan="3" class="text-center py-20 text-slate-300 font-bold uppercase tracking-widest">Belum ada trafik transaksi</td></tr>';
            
            document.getElementById('traffic-total-amount').innerText = `Rp ${grandTotal.toLocaleString()}`;
        }

        async function exportTable(targetId, filenamePrefix) {
            const target = document.getElementById(targetId);
            const btn = document.activeElement;
            const originalText = btn.innerHTML;
            
            const noPrintElements = target.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const canvas = await html2canvas(target, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true
                });
                
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                const dateStr = document.querySelector('input[type="date"]').value;
                
                link.download = `${filenamePrefix}_${dateStr}.png`;
                link.href = image;
                link.click();
            } catch (e) {
                console.error("Export failed", e);
            } finally {
                noPrintElements.forEach(el => el.style.display = '');
                btn.disabled = false;
                btn.innerHTML = originalText;
                initIcons();
            }
        }

        window.onload = () => { initIcons(); };
    </script>
