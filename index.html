    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (3600000 * 7));
}

        async function handleLogin() {
    const btn = document.getElementById('login-btn');
    const tokenInput = document.getElementById('token-input').value.toUpperCase().trim();
    const errorEl = document.getElementById('login-error');
    if (!tokenInput) return;

    btn.disabled = true;
    errorEl.classList.add('hidden');

    try {
        await auth.signInAnonymously();
        
        // 1. Cek apakah ini Master Token SPV (Static)
        if (tokenInput.startsWith('SPV')) {
            currentUser = { role: 'spv', name: 'SPV Operational', outlet: 'All Outlets', token: tokenInput };
            document.body.className = "bg-slate-50 theme-spv";
        } 
        // ... (bagian login SPV)
else {
    // 2. Cek Token Karyawan di Firestore
    const tokenSnap = await getPublicCol('tokens').doc(tokenInput).get();
    
    if (tokenSnap.exists) {
        const data = tokenSnap.data();
        currentUser = { 
            role: 'kasir', 
            name: data.karyawan, 
            outlet: data.outlet, 
            shift: data.shift,
            token: tokenInput 
        };
        document.body.className = "bg-slate-50 theme-kasir";
    } else {
        // Jika tidak ada di SPV dan tidak ada di Database, maka GAGAL
        throw new Error("Token Tidak Terdaftar / Kadaluarsa");
    }
}
// ...

        // Jalankan App
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentUser.name;
        document.getElementById('header-outlet-name').innerText = currentUser.outlet;
        document.getElementById('role-text').innerText = currentUser.role === 'spv' ? 'Supervisor Mode' : `Shift: ${currentUser.shift || 'Reguler'}`;
        initNavigation();

    } catch (error) {
        errorEl.innerText = error.message;
        errorEl.classList.remove('hidden');
    } finally {
        btn.disabled = false;
    }
}

// Logika Membuat Token Acak
async function generateToken() {
    const karyawan = document.getElementById('tk-nama').value.trim();
    const outlet = document.getElementById('tk-outlet').value;
    const shift = document.getElementById('tk-shift').value;

    if(!karyawan) return alert("Masukkan nama karyawan!");

    // Generate 6 digit kode unik
    const newToken = "PRO" + Math.random().toString(36).substring(2, 5).toUpperCase() + Math.floor(10 + Math.random() * 90);

    try {
        await getPublicCol('tokens').doc(newToken).set({
            karyawan, outlet, shift,
            createdAt: firebase.firestore.Timestamp.now(),
            createdBy: currentUser.name
        });
        document.getElementById('tk-nama').value = '';
        loadTokenList();
        alert(`Token berhasil dibuat: ${newToken}`);
    } catch (e) {
        alert("Gagal membuat token: " + e.message);
    }
}

// Load List Token dari Firestore
async function loadTokenList() {
    const tbody = document.getElementById('token-table-body');
    const snap = await getPublicCol('tokens').get();
    
    tbody.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        return `
        <tr class="hover:bg-slate-50">
            <td class="py-4 px-2 text-indigo-600 font-black tracking-widest">${doc.id}</td>
            <td class="py-4 px-2">${d.karyawan}</td>
            <td class="py-4 px-2 text-slate-500">${d.outlet}<br><span class="text-[10px] text-blue-500">${d.shift}</span></td>
            <td class="py-4 px-2 text-center">
                <button onclick="deleteToken('${doc.id}')" class="text-red-400 hover:text-red-600 p-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </td>
        </tr>`;
    }).join('') || '<tr><td colspan="4" class="text-center py-10 text-slate-300">Belum ada token aktif</td></tr>';
    initIcons();
}

async function deleteToken(id) {
    if(confirm("Hapus token ini? Karyawan tersebut tidak akan bisa login lagi.")) {
        await getPublicCol('tokens').doc(id).delete();
        loadTokenList();
    }
}
        function logout() { location.reload(); }

        function initNavigation() {
            const nav = document.getElementById('nav-tabs');
            let tabs = (currentUser.role === 'kasir') ? [
                { id: 'pos', label: 'Kasir', icon: 'calculator' },
                { id: 'saos', label: 'Input Saos', icon: 'droplet' },

        function switchView(viewId) {
            const container = document.getElementById('content-area');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-btn-active'));
            document.getElementById(`nav-${viewId}`)?.classList.add('nav-btn-active');
            
            if(viewId === 'pos') renderPOS(container);
            else if(viewId === 'saos') renderSaos(container);
            else if(viewId === 'riwayat') renderRiwayat(container);
            else if(viewId === 'spv_dashboard') renderSPVDashboard(container);
            else if(viewId === 'spv_tokens') renderSPVTokens(container);
            else if(viewId === 'spv_saos') renderSPVSaos(container);
            else if(viewId === 'spv_traffic') renderSPVTraffic(container);
            initIcons();
        }

        // --- POS & CART LOGIC ---
        function addToCart(id) {
            const allItems = [...MENU.roti, ...MENU.minuman];
            const item = allItems.find(i => i.id === id);
            const existing = currentCart.find(i => i.id === id);
            if(existing) existing.qty++;
            else currentCart.push({...item, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
    const list = document.getElementById('cart-list');
    if(!list) return;
            list.innerHTML = currentCart.map((it, idx) => `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center animate-fadeIn">
                    <div class="flex-1 overflow-hidden">
                        <div class="font-bold text-slate-800 text-xs truncate">${it.name}</div>
                        <div class="text-[9px] text-slate-500 font-medium">Rp ${it.price.toLocaleString()} x ${it.qty}</div>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white px-1 py-1 rounded-xl border">
                        <button onclick="changeQty(${idx}, -1)" class="w-6 h-6 bg-slate-100 rounded text-slate-600 flex items-center justify-center">-</button>
                        <span class="text-xs font-black min-w-[20px] text-center">${it.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-6 h-6 bg-slate-100 rounded text-slate-600 flex items-center justify-center">+</button>
                    </div>
                </div>`).join('');
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
    document.getElementById('total-price').innerText = `Rp ${total.toLocaleString()}`;

    // TAMBAHKAN LOGIKA INI:
    const cashInput = document.getElementById('cash-input');
    if (selectedPayment !== 'Tunai' && cashInput) {
        cashInput.value = total;
    }

    calcChange();
}

        function changeQty(idx, delta) {
            currentCart[idx].qty += delta;
            if(currentCart[idx].qty <= 0) currentCart.splice(idx, 1);
            updateCartUI();
        }

        function setPaymentMethod(method) {
    selectedPayment = method;
    const cashInput = document.getElementById('cash-input');
    const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);

    document.querySelectorAll('.pay-opt').forEach(btn => {
        btn.classList.toggle('payment-opt-active', btn.dataset.method === method);
    });

    if (method !== 'Tunai') {
        // Jika QRIS/Debit, isi otomatis dan kunci input
        cashInput.value = total;
        cashInput.readOnly = true;
        cashInput.classList.add('bg-slate-200'); // Beri warna beda agar terlihat terkunci
        cashInput.classList.remove('bg-slate-50');
    } else {
        // Jika Tunai, kosongkan (atau biarkan) dan buka kunci
        cashInput.readOnly = false;
        cashInput.classList.remove('bg-slate-200');
        cashInput.classList.add('bg-slate-50');
        cashInput.value = ''; 
    }
    calcChange();
}

        function setQuickCash(amount) {
    if (selectedPayment !== 'Tunai') return; // Tambahkan baris ini
    
    const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
    if (amount === 'pas') {
        document.getElementById('cash-input').value = total;
    } else {
        document.getElementById('cash-input').value = amount;
    }
    calcChange();
}

        function calcChange() {
            const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
            const cash = parseInt(document.getElementById('cash-input')?.value || 0);
            document.getElementById('change-display').innerText = `Rp ${Math.max(0, cash - total).toLocaleString()}`;
            document.getElementById('pay-btn').disabled = (total === 0 || cash < total);
        }

        async function processCheckout() {
    const payBtn = document.getElementById('pay-btn');
    const total = currentCart.reduce((a, b) => a + (b.price * b.qty), 0);
    const cash = parseInt(document.getElementById('cash-input').value || 0);

    if (total === 0 || cash < total) return;

    payBtn.disabled = true;
    payBtn.innerText = "MEMPROSES...";

    const nowJakarta = getJakartaDate(); 
    
    const data = {
        items: currentCart.map(it => ({...it})),
        total, 
        cash, 
        change: cash - total,
        method: selectedPayment,
        // Gunakan waktu Jakarta untuk disimpan ke Firestore
        timestamp: firebase.firestore.Timestamp.fromDate(nowJakarta),
        staff: currentUser.name,
        outlet: currentUser.outlet,
        hour: nowJakarta.getHours() 
    };
    
    try {
        await getPublicCol('transactions').add(data);
        showReceipt(data);
        currentCart = [];
        document.getElementById('cash-input').value = '';
        updateCartUI();
    } catch (error) {
        alert("Gagal memproses: " + error.message);
    } finally {
        payBtn.disabled = false;
        payBtn.innerText = "PROSES TRANSAKSI";
    }
}

        function showReceipt(data) {
    const formatDate = new Intl.DateTimeFormat('id-ID', { 
        timeZone: 'Asia/Jakarta', 
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).format(data.timestamp.toDate());
    const width = 32; // Standar lebar kertas thermal
    const line = "=".repeat(width);
    const dash = "-".repeat(width);

    // Fungsi pembantu untuk teks rata tengah
    const center = (txt) => {
        const textStr = String(txt).toUpperCase();
        const space = Math.max(0, Math.floor((width - textStr.length) / 2));
        return " ".repeat(space) + textStr;
    };

    // Fungsi pembantu untuk baris Item (Nama di kiri, Harga di kanan)
    const row = (l, r) => {
        const leftPart = String(l);
        const rightPart = String(r);
        const spaceNeeded = width - (leftPart.length + rightPart.length);
        return leftPart + " ".repeat(Math.max(1, spaceNeeded)) + rightPart;
    };

    // MENYUSUN STRUK
    let text = `\n${center("FAST PRO KASIR")}\n`;
    text += `${center(data.outlet || "OUTLET")}\n`;
    text += `${center(formatDate)}\n`;
    text += `${line}\n`;
    text += `${center("KASIR: " + (data.staff || "STAFF"))}\n`;
    text += `${center("METODE: " + (data.method || "CASH"))}\n`;
    text += `${dash}\n`;

    // Daftar Barang
    data.items.forEach(it => {
        // Nama barang jika terlalu panjang akan dipotong
        const name = it.name.toUpperCase();
        text += `${name.substring(0, width)}\n`;
        if(name.length > width) text += `${name.substring(width, width*2)}\n`;
        
        const detail = `  ${it.qty} x ${it.price.toLocaleString()}`;
        const subtotal = (it.price * it.qty).toLocaleString();
        text += row(detail, subtotal) + "\n";
    });

    text += `${dash}\n`;
    text += row("TOTAL", `Rp ${data.total.toLocaleString()}`) + "\n";
    text += row("BAYAR", `Rp ${data.cash.toLocaleString()}`) + "\n";
    text += row("KEMBALI", `Rp ${data.change.toLocaleString()}`) + "\n";
    text += `${line}\n`;
    text += `\n${center("Barang yang sudah dibeli")}\n`;
    text += `${center("tidak dapat ditukar/kembali")}\n`;
    text += `\n${center("*** TERIMA KASIH ***")}\n\n\n`;

    // Tampilkan ke elemen modal
    const content = document.getElementById('receipt-content');
    content.innerHTML = `<pre class="font-mono text-[12px] leading-tight inline-block text-left whitespace-pre">${text}</pre>`;
    
    // Tampilkan Modal
    document.getElementById('receipt-modal').classList.replace('hidden', 'flex');
}

async function loadLocalSaosHistory() {
    const table = document.getElementById('local-saos-history');
    if(!table) return;

    try {
        // Mengambil tanggal hari ini dalam format lokal (bukan UTC)
        const now = new Date();
        const todayStr = now.toLocaleDateString('en-CA'); // Hasilnya "YYYY-MM-DD"

        const snap = await getPublicCol('saos_usage').get();
        
        let docs = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        // Filter berdasarkan outlet dan tanggal lokal
        docs = docs.filter(d => {
            if (!d.timestamp || d.outlet !== currentUser.outlet) return false;
            const docDateStr = d.timestamp.toDate().toLocaleDateString('en-CA');
            return docDateStr === todayStr;
        });

        // Urutkan dari yang terbaru (berdasarkan jam)
        docs.sort((a,b) => b.timestamp.seconds - a.timestamp.seconds);

        table.innerHTML = docs.map(d => {
            const jam = d.timestamp.toDate().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            return `
                <tr class="hover:bg-slate-50 border-b border-slate-50">
                    <td class="px-4 py-3 text-slate-400 font-medium">${jam}</td>
                    <td class="px-4 py-3 text-slate-800 uppercase font-bold">${d.name}</td>

                    </td>
                </tr>`;

    } catch (error) {

    try {

        let docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
        
        // 1. Filter Berdasarkan Tanggal (WAJIB)
        if (dateFilter) {
            docs = docs.filter(d => {
                if (!d.timestamp) return false;

async function loadSPVAnalytics() {
    const dateInput = document.getElementById('spv-date')?.value;
    const outlet = document.getElementById('spv-outlet-filter')?.value || 'ALL';
    if (!dateInput) return;

    const snap = await getPublicCol('transactions').get();
    let data = snap.docs.map(d => d.data());
    
    // Filter Outlet
    if(outlet !== 'ALL') data = data.filter(d => d.outlet === outlet);
    
    let dTot = 0, mTot = 0, yTot = 0;
    const now = new Date(dateInput);
    const selectedYear = now.getFullYear();
    const selectedMonth = now.getMonth();

    data.forEach(t => {
        if (!t.timestamp) return;
        const dt = t.timestamp.toDate();
        const tDate = dt.toISOString().split('T')[0];
        
        // Hitung Total Terpilih (Hari yang dipilih di input date)
        if(tDate === dateInput) dTot += t.total;
        
        // Hitung Total Bulan (Sesuai bulan dari input date)
        if(dt.getMonth() === selectedMonth && dt.getFullYear() === selectedYear) mTot += t.total;
        
        // Hitung Total Tahun (Sesuai tahun dari input date)
        if(dt.getFullYear() === selectedYear) yTot += t.total;
    });

    // Update ke UI
    document.getElementById('total-selected').innerText = `Rp ${dTot.toLocaleString('id-ID')}`;
    document.getElementById('total-month').innerText = `Rp ${mTot.toLocaleString('id-ID')}`;
    document.getElementById('total-year').innerText = `Rp ${yTot.toLocaleString('id-ID')}`;

async function loadSPVSaosData() {
    const tableBody = document.getElementById('spv-saos-table');
    const dateStr = document.getElementById('saos-date').value; // Format: YYYY-MM-DD
    const outlet = document.getElementById('spv-outlet-filter').value;
    
    try {
        const snap = await getPublicCol('saos_usage').get();
        let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        docs = docs.filter(d => {
            if (!d.timestamp) return false;
            
            // PERBAIKAN: Paksa konversi ke tanggal Jakarta untuk dibandingkan dengan input date
            const docDateJakarta = d.timestamp.toDate().toLocaleDateString('en-CA', {
                timeZone: 'Asia/Jakarta'
            });
            
            const matchDate = docDateJakarta === dateStr;
            const matchOutlet = (outlet === 'ALL' || d.outlet === outlet);
            return matchDate && matchOutlet;
        });

        // Urutkan jam terbaru di atas
        docs.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);

        let totalQty = 0;
        tableBody.innerHTML = docs.map(d => {
            totalQty += d.qty;
            const jam = d.timestamp.toDate().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            return `
                <tr class="hover:bg-slate-50/50">
                    <td class="px-6 py-4">${d.outlet}</td>
                    <td class="px-6 py-4 text-slate-400">${jam}</td>
                    <td class="px-6 py-4 font-bold uppercase">${d.name}</td>
                    <td class="px-6 py-4 text-right font-black text-indigo-600">${d.qty}</td>
                    <td class="px-6 py-4 text-center no-print">
                        <button onclick="deleteSaos('${d.id}')" class="text-red-400 hover:text-red-600 p-2">
                            🗑️
                        </button>
                    </td>
                </tr>`;
        }).join('') || '<tr><td colspan="5" class="text-center py-20 text-slate-300">Tidak ada data saos</td></tr>';

        document.getElementById('saos-total-qty').innerText = totalQty;
        initIcons();
    } catch (e) {
        console.error("Gagal load data saos SPV:", e);
    }
}
window.loadSPVSaosData = loadSPVSaosData;

        async function loadSPVAnalytics() {
    const dateInput = document.getElementById('spv-date')?.value;
    const outlet = document.getElementById('spv-outlet-filter')?.value || 'ALL';
    if (!dateInput) return;

    try {
        // Ambil data terbaru dari Firestore
        const snap = await getPublicCol('transactions').get();
        let data = snap.docs.map(d => d.data());
        
        if(outlet !== 'ALL') data = data.filter(d => d.outlet === outlet);
        
        let dTot = 0, mTot = 0, yTot = 0;
        const selectedDate = new Date(dateInput);
        const selectedYear = selectedDate.getFullYear();
        const selectedMonth = selectedDate.getMonth();

        data.forEach(t => {
            if (!t.timestamp) return;
            const dt = t.timestamp.toDate();
            const tDateStr = dt.toLocaleDateString('en-CA'); // Format YYYY-MM-DD
            
            // Hitung Total Hari yang dipilih
            if(tDateStr === dateInput) dTot += t.total;
            
            // Hitung Total Bulan dari tanggal yang dipilih
            if(dt.getMonth() === selectedMonth && dt.getFullYear() === selectedYear) mTot += t.total;
            
            // Hitung Total Tahun dari tanggal yang dipilih
            if(dt.getFullYear() === selectedYear) yTot += t.total;
        });

        // Update UI secara instan
        document.getElementById('total-selected').innerText = `Rp ${dTot.toLocaleString('id-ID')}`;
        document.getElementById('total-month').innerText = `Rp ${mTot.toLocaleString('id-ID')}`;
        document.getElementById('total-year').innerText = `Rp ${yTot.toLocaleString('id-ID')}`;
    } catch (e) {
        console.error("Gagal update dashboard:", e);
    }
}

        // Pastikan fungsi ini berada di luar (scope global) agar bisa dipanggil tombol onclick
async function deleteSaos(id) {
    if(confirm("Hapus data stok saos ini?")) {
        try {
            await getPublicCol('saos_usage').doc(id).delete();
            
            // Refresh tabel di sisi Kasir jika sedang dibuka
            if (document.getElementById('local-saos-history')) {
                await loadLocalSaosHistory();
            }
            // Refresh tabel di sisi SPV jika sedang dibuka
            if (document.getElementById('spv-saos-table')) {
                await loadSPVSaosData();
            }
            
            alert("Data saos berhasil dihapus.");
        } catch (error) {
            alert("Gagal menghapus: " + error.message);
        }
    }
}
window.deleteSaos = deleteSaos;

        async function loadSPVTrafficData() {
            const dateStr = document.getElementById('traffic-date').value;
            const outlet = document.getElementById('spv-outlet-filter').value;
            const snap = await getPublicCol('transactions').get();
            let trans = snap.docs.map(d => d.data());
            
            document.getElementById('display-date-traffic').innerText = `Tgl: ${new Date(dateStr).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}`;
            document.getElementById('display-outlet-traffic').innerText = `Outlet: ${outlet === 'ALL' ? 'Semua Outlet' : outlet}`;
            
            trans = trans.filter(d => d.timestamp.toDate().toISOString().split('T')[0] === dateStr);
            if(outlet !== 'ALL') trans = trans.filter(d => d.outlet === outlet);
            
            const hours = {};
            trans.forEach(t => {
                const h = t.hour || 0;
                if(!hours[h]) hours[h] = { total: 0, items: {} };
                hours[h].total += t.total;
                t.items?.forEach(it => { hours[h].items[it.name] = (hours[h].items[it.name] || 0) + it.qty; });
            });
            
            let grandTotal = 0;
            const tableBody = document.getElementById('spv-traffic-table');
            const sortedHours = Object.entries(hours).sort((a,b) => a[0] - b[0]);
            
            tableBody.innerHTML = sortedHours.map(([h, st]) => {
                grandTotal += st.total;
                const itemDetails = Object.entries(st.items).map(([name, qty]) => `<span class="inline-block bg-slate-100 px-2 py-1 rounded-lg text-[9px] mr-1 mb-1">${name} (${qty})</span>`).join('');
                return `
                    <tr class="hover:bg-slate-50/50">
                        <td class="px-6 py-5 font-black text-indigo-600">${h.toString().padStart(2, '0')}:00</td>
                        <td class="px-6 py-5">${itemDetails}</td>
                        <td class="px-6 py-5 text-right text-sm font-black">Rp ${st.total.toLocaleString()}</td>
                    </tr>`;
            }).join('') || '<tr><td colspan="3" class="text-center py-20 text-slate-300 font-bold uppercase tracking-widest">Belum ada trafik transaksi</td></tr>';
            
            document.getElementById('traffic-total-amount').innerText = `Rp ${grandTotal.toLocaleString()}`;
        }

        async function exportTable(targetId, filenamePrefix) {
            const target = document.getElementById(targetId);
            const btn = document.activeElement;
            const originalText = btn.innerHTML;
            
            const noPrintElements = target.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const canvas = await html2canvas(target, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true
                });
                
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                const dateStr = document.querySelector('input[type="date"]').value;
                
                link.download = `${filenamePrefix}_${dateStr}.png`;
                link.href = image;
                link.click();
            } catch (e) {
                console.error("Export failed", e);
            } finally {
                noPrintElements.forEach(el => el.style.display = '');
                btn.disabled = false;
                btn.innerHTML = originalText;
                initIcons();
            }
        }

        window.onload = () => { initIcons(); };
    </script>
